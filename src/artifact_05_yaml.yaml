# docker-compose.yml
version: "3.8"

services:
  madrid2026-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madrid2026_relayer_daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=MAdr1D26Beacon1111111111111111111111111111
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3