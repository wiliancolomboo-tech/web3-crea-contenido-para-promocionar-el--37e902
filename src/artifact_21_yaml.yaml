version: "3.8"

services:
  encuentro-oracle-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encuentro_madrid_oracle
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - ORACLE_PRIVATE_KEY=[1,2,3...255]
      - RESEND_API_KEY=re_1234567890abcdef
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PROGRAM_ID=Encu26Madrid111111111111111111111111111111111
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"