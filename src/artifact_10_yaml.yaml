version: '3.8'

services:
  oracle-agent:
    build: .
    restart: always
    environment:
      - PROGRAM_ID=Encu26MadR1dPromoXxxx11111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - VERIFIER_PRIVATE_KEY=[1,2,3...255]
      - RESEND_API_KEY=re_live_your_resend_key_here
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"