version: "3.8"

services:
  encuentro-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encuentro_madrid_agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PROGRAM_ID=Encu26Madrid11111111111111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - VERIFIER_SECRET_KEY=${VERIFIER_SECRET_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"