version: '3.8'

services:
  madrid-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encuentro_madrid_orchestrator
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Encu26Madrid11111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NOTIFICATION_FALLBACK_EMAIL=staff@solanaencuentro.com
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"