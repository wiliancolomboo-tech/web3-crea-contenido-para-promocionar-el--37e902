[package]
name = "el-encuentro-madrid"
version = "1.0.0"
description = "Solana Proof-of-Amplification & Dynamic Social Ticketing Protocol for El Encuentro 2026 en Madrid"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "el_encuentro_madrid"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18.26"