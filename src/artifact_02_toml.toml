[package]
name = "madrid_pulse_2026"
version = "0.1.0"
description = "Proof of Amplification and Viral Engine for El Encuentro 2026 Madrid"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "madrid_pulse_2026"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }